name: Floc
options:
  bundleIdPrefix: nl.floc
  deploymentTarget:
    iOS: "17.0"
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: 6.0.0
targets:
  Floc:
    type: application
    platform: iOS
    sources:
      - path: Floc
      - path: maps
        type: folder
        buildPhase: resources
    dependencies:
      - package: MapLibre
    info:
      path: Floc/Info.plist
      properties:
        CFBundleDisplayName: Floc
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: Floc shows where you are on the event map.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.floc.prototype
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 9C846V3F7B
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
